name: Saldo CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  mobile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: apk --debug
          - os: macos-15
            build: ios --simulator --debug --no-codesign
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
      - run: ./scripts/bootstrap-mobile.sh
      - run: flutter analyze --no-pub
        working-directory: mobile
      - run: flutter test --dart-define=SALDO_SCREENSHOTS=true
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previews-${{ matrix.os }}
          path: mobile/build/previews/
          if-no-files-found: ignore
      - run: flutter build ${{ matrix.build }} --no-pub
        working-directory: mobile
