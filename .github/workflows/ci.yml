name: Saldo CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: server/go.sum
      - run: go -C server test ./...
      - run: go -C server vet ./...
      - run: docker compose up --build -d --wait
      - run: python3 scripts/check-import.py
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  mobile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: apk --debug
          - os: macos-15
            build: ios --simulator --debug --no-codesign
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
      - run: ./scripts/bootstrap-mobile.sh
      - run: flutter analyze --no-pub
        working-directory: mobile
      - run: flutter build ${{ matrix.build }} --no-pub
        working-directory: mobile
