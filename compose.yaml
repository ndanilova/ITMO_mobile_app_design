services:
  api:
    build: ./server
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://saldo:saldo@db:5432/saldo?sslmode=disable
    ports:
      - "127.0.0.1:${SALDO_API_PORT:-18080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 20
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: saldo
      POSTGRES_USER: saldo
      POSTGRES_PASSWORD: saldo
    volumes:
      - saldo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saldo"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  saldo-db:
