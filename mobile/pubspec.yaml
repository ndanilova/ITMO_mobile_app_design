name: saldo
description: Saldo mobile application scaffold
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: 13.3.3
  path_provider: 2.1.6
  csv: 6.0.0
  flutter_svg: 2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
